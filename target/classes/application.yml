spring:
  datasource:
    # SPRING_DATASOURCE_URL/USERNAME/PASSWORD bind directly through Spring Boot's environment binding.
    url: jdbc:postgresql://localhost:5432/datasetdb
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${PORT:8080}
  error:
    include-message: never
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
