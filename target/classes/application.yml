spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/datasetdb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    deserialization:
      fail-on-trailing-tokens: true
server:
  error:
    include-message: never
springdoc:
  swagger-ui:
    path: /swagger-ui/index.html
